name:  Frameworks for Python

on: [push]

jobs:
  build_frameworks:
    name: Build Frameworks
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install macher
        run: |
          wget https://github.com/culler/macher/releases/latest/download/macher
          chmod +x macher
          mv macher /usr/local/bin

      - name: Install notabot
        run: |
          python3 -m pip install notabot>=1.3.2

      - name: Install the Apple certificate and provisioning profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          DEV_ID: ${{ secrets.DEV_ID }}
          DEV_USERNAME: ${{ secrets.NOTARIZE_USERNAME }}
          DEV_PASSWORD: ${{ secrets.NOTARIZE_PASSWORD }}
        run: |
          # create variables
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          # import certificate and provisioning profile from secrets
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode --output=$CERTIFICATE_PATH

          # create temporary keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # import certificate to keychain
          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

          # Create notabot.cfg
          echo -e "[developer]\nidentity = $DEV_ID"  > notabot.cfg
          echo -e "username = $DEV_USERNAME"  >> notabot.cfg
          echo -e "password = $DEV_PASSWORD\n"  >> notabot.cfg
          echo -e "[entitlements]\nplist_file = entitlements.plist"  >> notabot.cfg

      - name: Build the frameworks
        run: |
          make
          make Tarball

      - uses: actions/upload-artifact@v4
        with:
          name: Frameworks.tgz
          path: ./Frameworks-*.tgz
